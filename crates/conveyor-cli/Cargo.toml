[package]
name = "conveyor-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "conveyor"
path = "src/main.rs"

[dependencies]
conveyor-core = { path = "../conveyor-core" }
agent-client-protocol = { version = "2.2", optional = true }
futures = { version = "0.3", optional = true }

[features]
default = []
acp = ["dep:agent-client-protocol", "dep:futures"]

[lints]
workspace = true
